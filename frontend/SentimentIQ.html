<style>
  :root {
    --bg: #0A0A0F;
    --bg-2: #07070B;
    --card: #111118;
    --card-2: #14141C;
    --line: rgba(255,255,255,0.06);
    --line-strong: rgba(255,255,255,0.1);
    --text: #ECEDF2;
    --text-2: #9A9CA8;
    --text-3: #5C5E6B;
    --blue: #3B82F6;
    --indigo: #6366F1;
    --green: #34D399;
    --green-2: #10B981;
    --red: #F87171;
    --red-2: #EF4444;
    --orange: #FB923C;
    --yellow: #FACC15;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body {
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(99,102,241,0.10), transparent 60%),
      radial-gradient(700px 400px at 0% 30%, rgba(59,130,246,0.06), transparent 60%),
      var(--bg);
    min-height: 100vh;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: "tnum" 1, "ss01" 1; }
  #root { min-height: 100vh; }

  .grid-bg::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1c1c26; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #25252f; }
  ::selection { background: rgba(59,130,246,0.35); color: white; }

  @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1);} 50% { opacity: 0.55; transform: scale(0.85);} }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-up { animation: fadeUp 0.6s cubic-bezier(.2,.7,.2,1) both; }

  /* ── Mobile responsive: stack everything below 820px ───────────── */
  @media (max-width: 820px) {
    main { padding: 18px 14px 60px !important; }
    .main-grid { grid-template-columns: 1fr !important; }
    .stats-row { grid-template-columns: repeat(2, 1fr) !important; }
    .source-grid { grid-template-columns: 1fr !important; }
    /* Hero price/title scale down */
    h1, .hero-price { font-size: 28px !important; }
    /* TrendCard duration buttons wrap */
    .trend-range { flex-wrap: wrap; }
    /* Footer stacks */
    footer { flex-direction: column; align-items: flex-start !important; }
    /* Hide tweaks panel on mobile (it's a dev tool anyway) */
    .twk-panel { display: none !important; }
  }
  @media (max-width: 520px) {
    .stats-row { grid-template-columns: 1fr !important; }
  }
</style>
<!-- Result injected server-side by app.py; falls back to null in Flask/local mode -->
<script>
  try { window.__INITIAL_DATA__ = __INITIAL_DATA_JSON__; } catch(e) { window.__INITIAL_DATA__ = null; }
</script>

<!-- ── tweaks-panel ─────────────────────────────────────────────────── -->
<script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-body::-webkit-scrollbar{width:8px}
  .twk-body::-webkit-scrollbar-track{background:transparent;margin:2px}
  .twk-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;
    border:2px solid transparent;background-clip:content-box}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;width:100%;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;
    border-radius:999px;background:rgba(0,0,0,.12);outline:none}
  .twk-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;background:#fff;
    border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
  .twk-num{display:flex;align-items:center;height:26px;padding:0 0 0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;background:rgba(255,255,255,.6)}
  .twk-num-lbl{font-weight:500;color:rgba(41,38,27,.6);cursor:ew-resize;user-select:none;padding-right:8px}
  .twk-num input{flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;
    font-variant-numeric:tabular-nums;text-align:right;padding:0 8px 0 0;outline:none;color:inherit}
  .twk-swatch{appearance:none;-webkit-appearance:none;width:56px;height:22px;
    border:.5px solid rgba(0,0,0,.1);border-radius:6px;padding:0;cursor:default;background:transparent;flex-shrink:0}
  .twk-swatch::-webkit-color-swatch-wrapper{padding:0}
  .twk-swatch::-webkit-color-swatch{border:0;border-radius:5.5px}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clamp = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const maxR = Math.max(PAD, window.innerWidth - panel.offsetWidth - PAD);
    const maxB = Math.max(PAD, window.innerHeight - panel.offsetHeight - PAD);
    offsetRef.current = {
      x: Math.min(maxR, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxB, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    if (!open) return;
    clamp();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clamp) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clamp);
    return () => window.removeEventListener('resize', clamp);
  }, [open, clamp]);
  React.useEffect(() => {
    const onMsg = (e) => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  const onDragStart = (e) => {
    const panel = dragRef.current; if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startR = window.innerWidth - r.right, startB = window.innerHeight - r.bottom;
    const move = (ev) => { offsetRef.current = { x: startR - (ev.clientX - sx), y: startB - (ev.clientY - sy) }; clamp(); };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return <><div className="twk-sect">{label}</div>{children}</>;
}
function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl"><span>{label}</span>{value != null && <span className="twk-val">{value}</span>}</div>
      {children}
    </div>
  );
}
function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}
function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value); valueRef.current = value;
  const segAt = (cx) => {
    const r = trackRef.current.getBoundingClientRect();
    return opts[Math.max(0, Math.min(n - 1, Math.floor(((cx - r.left - 2) / (r.width - 4)) * n)))].value;
  };
  const onPointerDown = (e) => {
    setDragging(true); const v0 = segAt(e.clientX); if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (!trackRef.current) return; const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}
function TweakText({ label, value, placeholder, onChange }) {
  return <TweakRow label={label}><input className="twk-field" type="text" value={value} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} /></TweakRow>;
}
function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => { if (min != null && n < min) return min; if (max != null && n > max) return max; return n; };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault(); startRef.current = { x: e.clientX, val: value };
    const dec = (String(step).split('.')[1] || '').length;
    const move = (ev) => { const raw = startRef.current.val + (ev.clientX - startRef.current.x) * step; onChange(clamp(Number((Math.round(raw / step) * step).toFixed(dec)))); };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step} onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span style={{ paddingRight: 8, color: 'rgba(41,38,27,.45)' }}>{unit}</span>}
    </div>
  );
}
Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakSlider, TweakRadio, TweakText, TweakNumber });
</script>

<!-- ── gauge ────────────────────────────────────────────────────────── -->
<script type="text/babel">
const GAUGE_ZONES = [
  { from: 0,  to: 35,  color: "#EF4444", label: "Bearish" },
  { from: 35, to: 50,  color: "#FB923C", label: "Slightly Bearish" },
  { from: 50, to: 65,  color: "#FACC15", label: "Slightly Bullish" },
  { from: 65, to: 100, color: "#10B981", label: "Bullish" },
];
function zoneFor(score) {
  return GAUGE_ZONES.find(z => score >= z.from && score <= z.to) || GAUGE_ZONES[3];
}
function polar(cx, cy, r, deg) {
  const rad = (deg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function arcPath(cx, cy, r, startDeg, endDeg) {
  const s = polar(cx, cy, r, startDeg), e = polar(cx, cy, r, endDeg);
  return `M ${s.x} ${s.y} A ${r} ${r} 0 ${endDeg - startDeg <= 180 ? 0 : 1} 1 ${e.x} ${e.y}`;
}
function scoreToTopDeg(score) { return -90 + (score / 100) * 180; }

function Gauge({ score = 72.4, size = 360 }) {
  const z = zoneFor(score);
  const cx = size / 2, cy = size * 0.62, r = size * 0.38, stroke = size * 0.055;
  const trackD = arcPath(cx, cy, r, -90, 90);
  const zoneArcs = GAUGE_ZONES.map(zone => ({
    d: arcPath(cx, cy, r, scoreToTopDeg(zone.from), scoreToTopDeg(zone.to)),
    color: zone.color,
  }));
  const ticks = [];
  for (let i = 0; i <= 100; i += 10) {
    const ang = scoreToTopDeg(i);
    ticks.push({
      ...polar(cx, cy, r - stroke / 2 - 8, ang),
      x2: polar(cx, cy, r - stroke / 2 - 2, ang).x,
      y2: polar(cx, cy, r - stroke / 2 - 2, ang).y,
      major: i % 50 === 0,
    });
  }
  const labels = [{ v: 0, ang: -90 }, { v: 50, ang: 0 }, { v: 100, ang: 90 }]
    .map(l => ({ ...l, ...polar(cx, cy, r + stroke / 2 + 16, l.ang) }));

  const [animatedScore, setAnimatedScore] = React.useState(0);
  React.useEffect(() => {
    let raf, start;
    const dur = 1400;
    const step = (t) => {
      if (!start) start = t;
      const k = Math.min(1, (t - start) / dur);
      setAnimatedScore(score * (1 - Math.pow(1 - k, 3)));
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [score]);

  const animAngle = -90 + (animatedScore / 100) * 180;
  const animZone = zoneFor(animatedScore);

  return (
    <div style={{ position: "relative", width: size, height: size * 0.95, margin: "0 auto" }}>
      <svg width={size} height={size * 0.78} viewBox={`0 0 ${size} ${size * 0.78}`} style={{ overflow: "visible" }}>
        <defs>
          <filter id="gaugeGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor={animZone.color} stopOpacity="0.35" />
            <stop offset="60%" stopColor={animZone.color} stopOpacity="0.05" />
            <stop offset="100%" stopColor={animZone.color} stopOpacity="0" />
          </radialGradient>
          <linearGradient id="needleGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#ffffff" />
            <stop offset="100%" stopColor={animZone.color} />
          </linearGradient>
        </defs>
        <circle cx={cx} cy={cy} r={r * 0.9} fill="url(#centerGlow)" />
        <path d={trackD} stroke="rgba(255,255,255,0.06)" strokeWidth={stroke} fill="none" strokeLinecap="round" />
        {zoneArcs.map((za, i) => (
          <path key={i} d={za.d} stroke={za.color} strokeWidth={stroke} fill="none" strokeLinecap="butt" opacity="0.85" />
        ))}
        <path d={zoneArcs.find(za => za.color === animZone.color).d}
              stroke={animZone.color} strokeWidth={stroke} fill="none" strokeLinecap="butt"
              filter="url(#gaugeGlow)" opacity="0.5" />
        {ticks.map((t, i) => (
          <line key={i} x1={t.x} y1={t.y} x2={t.x2} y2={t.y2}
                stroke={t.major ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.18)"}
                strokeWidth={t.major ? 1.5 : 1} strokeLinecap="round" />
        ))}
        {labels.map((l, i) => (
          <text key={i} x={l.x} y={l.y} fill="rgba(255,255,255,0.4)"
                fontSize="11" fontFamily="JetBrains Mono, monospace" textAnchor="middle" dominantBaseline="middle">
            {l.v}
          </text>
        ))}
        <g style={{ transform: `rotate(${animAngle}deg)`, transformOrigin: `${cx}px ${cy}px` }}>
          <line x1={cx} y1={cy} x2={cx} y2={cy - r + stroke + 6}
                stroke="url(#needleGrad)" strokeWidth="3" strokeLinecap="round" filter="url(#gaugeGlow)" />
          <line x1={cx} y1={cy} x2={cx} y2={cy - r + stroke + 6}
                stroke="white" strokeWidth="1.4" strokeLinecap="round" />
        </g>
        <circle cx={cx} cy={cy} r="9" fill="#0A0A0F" stroke={animZone.color} strokeWidth="2" />
        <circle cx={cx} cy={cy} r="3" fill={animZone.color} />
      </svg>
      <div style={{ position: "absolute", left: 0, right: 0, top: cy + 24, textAlign: "center", pointerEvents: "none" }}>
        <div style={{ fontSize: 10, letterSpacing: "0.22em", textTransform: "uppercase", color: "var(--text-3)", marginBottom: 4 }}>
          Sentiment Score
        </div>
        <div className="mono" style={{ fontSize: size * 0.18, fontWeight: 600, letterSpacing: "-0.04em", lineHeight: 1, color: "white", textShadow: `0 0 28px ${animZone.color}66` }}>
          {animatedScore.toFixed(1)}
          <span style={{ fontSize: size * 0.06, color: "var(--text-3)", fontWeight: 500, marginLeft: 4 }}>/100</span>
        </div>
      </div>
    </div>
  );
}
window.Gauge = Gauge;
window.GAUGE_ZONES = GAUGE_ZONES;
window.zoneFor = zoneFor;
</script>

<script type="text/babel">
function smoothPath(points) {
  if (points.length < 2) return "";
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i - 1] || points[i], p1 = points[i], p2 = points[i + 1], p3 = points[i + 2] || p2;
    d += ` C ${p1.x + (p2.x - p0.x) / 6} ${p1.y + (p2.y - p0.y) / 6}, ${p2.x - (p3.x - p1.x) / 6} ${p2.y - (p3.y - p1.y) / 6}, ${p2.x} ${p2.y}`;
  }
  return d;
}
function TrendChart({ data }) {
  const W = 880, H = 260, padL = 44, padR = 28, padT = 24, padB = 32;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const xFor = (i) => padL + (i / (data.length - 1)) * innerW;
  const yFor = (v) => padT + (1 - v / 100) * innerH;
  const points = data.map((d, i) => ({ x: xFor(i), y: yFor(d.score), ...d }));
  const pathD = smoothPath(points);
  const areaD = pathD + ` L ${points[points.length - 1].x} ${padT + innerH} L ${points[0].x} ${padT + innerH} Z`;
  const [hover, setHover] = React.useState(null);
  const svgRef = React.useRef(null);
  const handleMove = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * W;
    let best = 0, bestDist = Infinity;
    points.forEach((p, i) => { const d = Math.abs(p.x - x); if (d < bestDist) { bestDist = d; best = i; } });
    setHover(best);
  };
  return (
    <div style={{ position: "relative", width: "100%" }}>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block" }}
           onMouseMove={handleMove} onMouseLeave={() => setHover(null)}>
        <defs>
          <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#3B82F6" stopOpacity="0.35" />
            <stop offset="100%" stopColor="#3B82F6" stopOpacity="0" />
          </linearGradient>
          <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#3B82F6" />
            <stop offset="100%" stopColor="#6366F1" />
          </linearGradient>
          <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" />
          </filter>
        </defs>
        {[0, 25, 50, 75, 100].map(t => (
          <g key={t}>
            <line x1={padL} y1={yFor(t)} x2={W - padR} y2={yFor(t)} stroke="rgba(255,255,255,0.04)" strokeWidth="1" />
            <text x={padL - 10} y={yFor(t)} fill="rgba(255,255,255,0.35)" fontSize="10" fontFamily="JetBrains Mono, monospace" textAnchor="end" dominantBaseline="middle">{t}</text>
          </g>
        ))}
        <line x1={padL} y1={yFor(50)} x2={W - padR} y2={yFor(50)} stroke="rgba(255,255,255,0.18)" strokeWidth="1" strokeDasharray="4 5" />
        <text x={W - padR - 6} y={yFor(50) - 6} fill="rgba(255,255,255,0.32)" fontSize="10" fontFamily="JetBrains Mono, monospace" textAnchor="end">NEUTRAL</text>
        <path d={areaD} fill="url(#areaFill)" />
        <path d={pathD} stroke="url(#lineGrad)" strokeWidth="6" fill="none" filter="url(#lineGlow)" opacity="0.6" />
        <path d={pathD} stroke="url(#lineGrad)" strokeWidth="2.2" fill="none" strokeLinecap="round" />
        {points.map((p, i) => (
          <text key={i} x={p.x} y={H - 10} fill="rgba(255,255,255,0.45)" fontSize="11" fontFamily="JetBrains Mono, monospace" textAnchor="middle">{p.day}</text>
        ))}
        {points.map((p, i) => (
          <g key={i}>
            {hover === i && <circle cx={p.x} cy={p.y} r="10" fill="#3B82F6" opacity="0.18" />}
            <circle cx={p.x} cy={p.y} r={hover === i ? 5 : 3.5} fill="#0A0A0F" stroke="#3B82F6" strokeWidth="2" />
          </g>
        ))}
        {hover !== null && (
          <line x1={points[hover].x} y1={padT} x2={points[hover].x} y2={padT + innerH}
                stroke="rgba(59,130,246,0.4)" strokeWidth="1" strokeDasharray="3 3" />
        )}
      </svg>
      {hover !== null && (() => {
        const p = points[hover];
        const tipW = 140;
        return (
          <div style={{
            position: "absolute",
            left: `calc(${(p.x / W) * 100}% - ${tipW / 2}px)`,
            top: `calc(${(p.y / H) * 100}% - 74px)`,
            width: tipW,
            background: "rgba(20,20,28,0.96)",
            border: "1px solid rgba(59,130,246,0.4)",
            borderRadius: 8, padding: "8px 10px", pointerEvents: "none",
            boxShadow: "0 8px 24px rgba(0,0,0,0.5)", backdropFilter: "blur(8px)",
          }}>
            <div style={{ fontSize: 10, color: "var(--text-3)", letterSpacing: "0.08em", textTransform: "uppercase" }}>{p.date}</div>
            <div className="mono" style={{ fontSize: 18, fontWeight: 600, color: "white", marginTop: 2 }}>{p.score.toFixed(1)}</div>
            <div style={{ fontSize: 11, color: zoneFor(p.score).color, marginTop: 1 }}>{zoneFor(p.score).label}</div>
          </div>
        );
      })()}
    </div>
  );
}
window.TrendChart = TrendChart;
</script>

// ── App ────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = window.useTweaks
    ? window.useTweaks(MOCK_DEFAULTS)
    : [MOCK_DEFAULTS, () => {}];

  // Streamlit mode: data is injected server-side into window.__INITIAL_DATA__
  // Flask/local mode: window.__INITIAL_DATA__ is null, fetch from /api/analyse
  const IS_STREAMLIT = !!window.__INITIAL_DATA__;

  const [apiData, setApiData] = useState(window.__INITIAL_DATA__ || null);
  const [loading, setLoading] = useState(false);
  const [sourceErrors, setSourceErrors] = useState(
    (window.__INITIAL_DATA__ && window.__INITIAL_DATA__.errors) ? window.__INITIAL_DATA__.errors : {}
  );
  const [lastUpdated, setLastUpdated] = useState(window.__INITIAL_DATA__ ? Date.now() : null);

  // Sync API result into tweaks so the Tweaks panel stays in sync
  useEffect(() => {
    if (!apiData) return;
    setTweak({
      ticker: apiData.ticker,
      company: apiData.company,
      price: apiData.price,
      changePct: apiData.changePct,
      score: apiData.score,
      confidence: apiData.confidence,
      mentions: apiData.mentions,
      bullPct: apiData.bullPct,
      trendDelta: Math.abs(apiData.trendDelta || 0),
    });
  }, [apiData]);

  const analyse = useCallback(async (t) => {
    window.scrollTo(0, 0);
    setLoading(true);
    setSourceErrors({});
    try {
      const url = `${API_BASE}/api/analyse?ticker=${encodeURIComponent(t)}`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`Server error ${resp.status}`);
      const data = await resp.json();
      if (data.error && !data.ticker) throw new Error(data.error);
      setApiData(data);
      setSourceErrors(data.errors || {});
      setLastUpdated(Date.now());
    } catch (err) {
      setSourceErrors({ _global: err.message });
    } finally {
      setLoading(false);
    }
  }, []);

  // Flask/local mode only: auto-fetch on first load
  useEffect(() => { if (!IS_STREAMLIT) analyse(MOCK_DEFAULTS.ticker); }, []);

  const onTickerSubmit = (t) => {
    if (IS_STREAMLIT) {
      // Navigate the top Streamlit frame to ?ticker=X so Python reruns with new ticker.
      // We use a programmatic anchor click (target="_top") rather than setting
      // window.top.location directly, which can throw SecurityError inside iframes.
      const a = document.createElement('a');
      a.style.display = 'none';
      a.target = '_top';
      try {
        a.href = window.top.location.pathname + '?ticker=' + encodeURIComponent(t);
      } catch (_) {
        a.href = '/?ticker=' + encodeURIComponent(t);
      }
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } else {
      setTweak({ ticker: t });
      analyse(t);
    }
  };

  // Derived display values
  const trendData = apiData ? apiData.trend : MOCK_TREND;
  const hotTopicsData = apiData ? apiData.hotTopics : MOCK_TOPICS;
  const trendDirection = apiData ? apiData.trendDirection : "Improving";

  // Live "updated Xs ago" counter (replaces the old TopNav timer)
  const [elapsed, setElapsed] = useState(0);
  useEffect(() => {
    if (!lastUpdated) return;
    setElapsed(0);
    const iv = setInterval(() => setElapsed(s => s + 1), 1000);
    return () => clearInterval(iv);
  }, [lastUpdated]);

  return (
    <div style={{ position: "relative", zIndex: 1 }}>
      {loading && <LoadingOverlay />}

      {/* Compact status strip (no search bar — Streamlit form handles that) */}
      <div style={{ position: "sticky", top: 0, zIndex: 20, backdropFilter: "blur(14px)", background: "rgba(10,10,15,0.72)", borderBottom: "1px solid var(--line)" }}>
        <div style={{ maxWidth: 1240, margin: "0 auto", padding: "10px 28px", display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 14, color: "var(--text-3)", fontSize: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <PulseDot color="#10B981" />
            <span style={{ color: "var(--text-2)" }}>Live</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <IconClock size={13} />
            <span className="mono">{lastUpdated ? `Updated ${elapsed}s ago` : "—"}</span>
          </div>
        </div>
      </div>

      <main style={{ maxWidth: 1240, margin: "0 auto", padding: "28px 28px 60px" }}>
        {sourceErrors._global && (
          <div style={{ marginBottom: 16, padding: "12px 16px", borderRadius: 10, background: "rgba(239,68,68,0.07)", border: "1px solid rgba(239,68,68,0.3)", color: "#F87171", fontSize: 13, display: "flex", alignItems: "center", gap: 10 }}>
            <IconWarn size={16} /> Analysis failed: {sourceErrors._global}
          </div>
        )}

        <Hero ticker={tweaks.ticker} company={tweaks.company} price={tweaks.price} changePct={tweaks.changePct} />
        <div style={{ height: 28 }} />

        <div className="main-grid" style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) 360px", gap: 16, alignItems: "start" }}>
          <ScoreCard score={tweaks.score} confidence={tweaks.confidence} />
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            <Card>
              <CardHeader icon={<IconSparkle size={14}/>} title="AI Summary" />
              <div style={{ marginTop: 12, color: "var(--text)", fontSize: 13.5, lineHeight: 1.6 }}>
                Sentiment around <span style={{ color: "white", fontWeight: 600 }}>${tweaks.ticker}</span> has shifted
                <span style={{ color: zoneFor(tweaks.score).color, fontWeight: 600 }}> {zoneFor(tweaks.score).label.toLowerCase()} </span>
                this week. Reddit is the most active source, while news sentiment provides directional confirmation. Monitor for shifts before earnings.
              </div>
              <div style={{ marginTop: 14, display: "flex", gap: 6, flexWrap: "wrap" }}>
                {(hotTopicsData.slice(0, 3)).map(t => (
                  <span key={t.kw} style={{ padding: "3px 8px", fontSize: 11, borderRadius: 999, background: "rgba(99,102,241,0.1)", border: "1px solid rgba(99,102,241,0.25)", color: "#A5B4FC" }}>#{t.kw}</span>
                ))}
              </div>
            </Card>
            <Card>
              <CardHeader icon={<IconShield size={14}/>} title="Signal Quality" />
              <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 10 }}>
                {[
                  { label: "Volume", v: Math.min(100, Math.round(tweaks.mentions / 3)), color: "#3B82F6" },
                  { label: "Source diversity", v: apiData ? 72 : 72, color: "#6366F1" },
                  { label: "Model certainty", v: tweaks.confidence === "High" ? 91 : tweaks.confidence === "Medium" ? 68 : 45, color: "#34D399" },
                ].map(b => (
                  <div key={b.label}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "var(--text-2)" }}>
                      <span>{b.label}</span>
                      <span className="mono" style={{ color: "white" }}>{b.v}</span>
                    </div>
                    <div style={{ marginTop: 5, height: 4, borderRadius: 999, background: "rgba(255,255,255,0.05)" }}>
                      <div style={{ width: `${b.v}%`, height: "100%", borderRadius: 999, background: `linear-gradient(90deg, ${b.color}aa, ${b.color})`, boxShadow: `0 0 8px ${b.color}66` }}/>
                    </div>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        </div>

        <div style={{ height: 16 }} />
        <StatsRow mentions={tweaks.mentions} bullPct={tweaks.bullPct} trendDelta={tweaks.trendDelta} trendDirection={trendDirection} />

        <div style={{ height: 16 }} />
        <TrendCard
          trendData={trendData}
          currentDays={apiData && apiData.days ? apiData.days : 7}
          onChangeRange={(d) => {
            if (IS_STREAMLIT) {
              const a = document.createElement('a');
              a.style.display = 'none';
              a.target = '_top';
              try {
                a.href = window.top.location.pathname + '?ticker=' + encodeURIComponent(tweaks.ticker) + '&days=' + d;
              } catch (_) {
                a.href = '/?ticker=' + encodeURIComponent(tweaks.ticker) + '&days=' + d;
              }
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            }
          }}
        />

        <div style={{ height: 28 }} />
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "8px 4px 16px" }}>
          <h2 style={{ margin: 0, fontSize: 14, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--text-2)", fontWeight: 500 }}>Source Breakdown</h2>
          <div style={{ color: "var(--text-3)", fontSize: 12 }}>
            <span className="mono">{tweaks.mentions}</span> total mentions across <span className="mono">3</span> sources
          </div>
        </div>
        <SourceBreakdown sources={apiData ? apiData.sources : null} errors={sourceErrors} ticker={tweaks.ticker} />

        <div style={{ height: 16 }} />
        <HotTopics topics={hotTopicsData} />

        <footer style={{ marginTop: 56, paddingTop: 24, borderTop: "1px solid var(--line)", display: "flex", justifyContent: "space-between", alignItems: "center", color: "var(--text-3)", fontSize: 12, flexWrap: "wrap", gap: 14 }}>
          <div>
            Data sourced from <span style={{ color: "var(--text-2)" }}>Reddit</span>,
            <span style={{ color: "var(--text-2)" }}> StockTwits</span> &amp;
            <span style={{ color: "var(--text-2)" }}> Yahoo Finance</span>
            &nbsp;·&nbsp; Powered by <span style={{ color: "var(--text-2)" }}>FinBERT</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <a href="#" style={{ color: "var(--text-3)", textDecoration: "none", display: "inline-flex", alignItems: "center", gap: 6 }}>
              <IconGithub size={14}/> github.com/sentimentiq
            </a>
            <span className="mono" style={{ color: "var(--text-3)" }}>v0.4.2</span>
          </div>
        </footer>
      </main>

      {window.TweaksPanel && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection title="Ticker">
            <window.TweakText label="Symbol" value={tweaks.ticker} onChange={v => setTweak({ ticker: v.toUpperCase() })}/>
            <window.TweakText label="Company" value={tweaks.company} onChange={v => setTweak({ company: v })}/>
            <window.TweakNumber label="Price" value={tweaks.price} step={0.01} onChange={v => setTweak({ price: v })}/>
            <window.TweakNumber label="Change %" value={tweaks.changePct} step={0.01} onChange={v => setTweak({ changePct: v })}/>
          </window.TweakSection>
          <window.TweakSection title="Sentiment">
            <window.TweakSlider label="Score" value={tweaks.score} min={0} max={100} step={0.1} onChange={v => setTweak({ score: v })}/>
            <window.TweakRadio label="Confidence" value={tweaks.confidence}
              options={[{value: "Low", label: "Low"}, {value: "Medium", label: "Med"}, {value: "High", label: "High"}]}
              onChange={v => setTweak({ confidence: v })}/>
            <window.TweakSlider label="Mentions" value={tweaks.mentions} min={0} max={1000} step={1} onChange={v => setTweak({ mentions: v })}/>
            <window.TweakSlider label="Bull %" value={tweaks.bullPct} min={0} max={100} step={1} onChange={v => setTweak({ bullPct: v })}/>
          </window.TweakSection>
        </window.TweaksPanel>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
